name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository and use no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Card 0.4b tests download a MongoDB binary; cache it between runs.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-memory-server-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-memory-server-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Production dependencies must be free of high-severity advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev-only findings (eslint-plugin-boundaries, no non-breaking fix) are reported, not blocking.
      - name: Report all dependency advisories
        run: npm audit --audit-level=high || true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # Last commit whose history is known to contain committed secrets (owner task P1).
      # Only commits after it are scanned, so old history does not fail every run.
      GITLEAKS_BASELINE_COMMIT: "b772501845e9e440a4c9183f1128450e90ec6fdd"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The CLI is used instead of gitleaks-action so no license key is needed and the
      # commit range can be limited with --log-opts.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan commits since the baseline
        run: ./gitleaks git --config .gitleaks.toml --log-opts "${GITLEAKS_BASELINE_COMMIT}..HEAD" --redact --verbose .
