name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository and use no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The queue and permission-cache tests need a real Redis; the suite fails without TEST_REDIS_URL on CI.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Card 0.4b tests download a MongoDB binary. The cache sits after `npm ci` because `npm ci` deletes
      # node_modules. The key is the pinned binary version (MONGODB_BINARY_VERSION in
      # apps/api/src/test-support/replica-set.global-setup.ts: change both together), not the lockfile hash,
      # so dependency updates do not throw the binary away.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: ${{ runner.os }}-mongodb-binary-8.0.13

      # Type-aware lint needs the built types of the workspace packages (review M2).
      - name: Build workspace packages
        run: npx turbo run build --filter="./packages/*"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
        # apps/admin and apps/platform validate these at build time; the values are placeholders, not secrets.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_BRAND_NAME: Example Brand

      # Production dependencies must be free of high-severity advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev-only findings (eslint-plugin-boundaries, no non-breaking fix) are reported, not blocking.
      - name: Report all dependency advisories
        run: npm audit --audit-level=high || true

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official release checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # Last commit whose history is known to contain committed secrets (owner task P1).
      # Only commits after it are scanned, so old history does not fail every run.
      GITLEAKS_BASELINE_COMMIT: "b772501845e9e440a4c9183f1128450e90ec6fdd"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The CLI is used instead of gitleaks-action so no license key is needed and the
      # commit range can be limited with --log-opts.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan commits since the baseline
        run: ./gitleaks git --config .gitleaks.toml --log-opts "${GITLEAKS_BASELINE_COMMIT}..HEAD" --redact --verbose .
